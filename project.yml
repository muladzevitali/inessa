name: Inessa
options:
  bundleIdPrefix: com.inessa
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  Inessa:
    type: application
    platform: iOS
    sources:
      - path: Inessa
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inessa.polish
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Inessa/Info.plist
      properties:
        CFBundleDisplayName: Inessa
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - inessa
    dependencies:
      - target: InessaWidget
        embed: true
  InessaWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: InessaWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inessa.polish.widget
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: InessaWidget/Info.plist
      properties:
        CFBundleDisplayName: Inessa Word of the Day
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  InessaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: InessaTests
    dependencies:
      - target: Inessa
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inessa.polish.tests
